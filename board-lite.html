<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Board Lite</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html,body { margin:0; width:100%; height:100%; background:#111; color:#eee; font-family:Arial,Helvetica,sans-serif; }
  body { display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .app { width:100%; height:100%; padding:28px; display:grid; grid-template-rows:auto 1fr auto; gap:20px; }
  header { display:flex; align-items:center; justify-content:space-between; }
  h1 { margin:0; font-size:34px; font-weight:700; }
  #status { font-size:22px; opacity:.85; }
  main { display:grid; grid-template-columns:1.4fr 1fr; gap:22px; min-height:0; }
  .videoBox { background:#000; border-radius:18px; overflow:hidden; display:flex; align-items:center; justify-content:center; min-height:0; }
  video { width:100%; height:100%; object-fit:cover; background:#000; }
  .controls { display:grid; grid-template-columns:1fr 1fr; gap:16px; align-content:center; }
  button { min-height:110px; border:0; border-radius:18px; background:#2a2a2a; color:#fff; font-size:28px; font-weight:700; padding:18px; cursor:pointer; }
  button:active { transform:scale(.985); }
  button.primary { background:#3949ab; }
  button.danger { background:#8e2424; }
  button.on { outline:5px solid #fff; }
  footer { display:flex; gap:16px; }
  footer button { flex:1; min-height:80px; font-size:24px; }
  #info { position:fixed; left:16px; bottom:8px; font-size:14px; opacity:.45; pointer-events:none; }
  @media (max-width:900px) { main { grid-template-columns:1fr; grid-template-rows:1fr auto; } .controls { grid-template-columns:repeat(4,1fr); } button { min-height:80px; font-size:22px; } }
</style>
</head>
<body>
<div class="app">
  <header><h1>Board Lite</h1><div id="status">Idle</div></header>
  <main>
    <div class="videoBox"><video id="preview" autoplay playsinline muted></video></div>
    <div class="controls">
      <button class="primary" id="start">Start A/V</button>
      <button id="mic">Mic: ON</button>
      <button id="cam">Camera: ON</button>
      <button class="danger" id="stop">Stop</button>
    </div>
  </main>
  <footer><button id="discord">Open Discord</button><button id="reload">Reload</button></footer>
</div>
<div id="info"></div>
<script>
'use strict';
let stream = null;
const $ = id => document.getElementById(id);
const status = msg => $('status').textContent = msg;
async function startAV() {
  try {
    status('Requesting camera + microphone…');
    if (stream) stream.getTracks().forEach(t => t.stop());
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { echoCancellation:true, noiseSuppression:true, autoGainControl:true },
      video: { width:{ideal:1280}, height:{ideal:720}, frameRate:{ideal:15,max:20} }
    });
    $('preview').srcObject = stream;
    $('mic').textContent = 'Mic: ON';
    $('cam').textContent = 'Camera: ON';
    $('mic').classList.add('on');
    $('cam').classList.add('on');
    status('A/V active');
  } catch (e) { console.error(e); status(e.name + ': ' + e.message); }
}
function toggle(kind, button) {
  if (!stream) return;
  const tracks = kind === 'audio' ? stream.getAudioTracks() : stream.getVideoTracks();
  if (!tracks.length) return;
  const enabled = !tracks[0].enabled;
  tracks.forEach(t => t.enabled = enabled);
  button.textContent = (kind === 'audio' ? 'Mic: ' : 'Camera: ') + (enabled ? 'ON' : 'OFF');
  button.classList.toggle('on', enabled);
}
function stopAV() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null;
  $('preview').srcObject = null;
  $('mic').classList.remove('on'); $('cam').classList.remove('on');
  $('mic').textContent = 'Mic: OFF'; $('cam').textContent = 'Camera: OFF';
  status('Stopped');
}
$('start').onclick = startAV;
$('mic').onclick = () => toggle('audio', $('mic'));
$('cam').onclick = () => toggle('video', $('cam'));
$('stop').onclick = stopAV;
$('discord').onclick = () => location.href = 'https://discord.com/channels/@me';
$('reload').onclick = () => location.reload();
const mem = performance.memory ? ` | heap ${Math.round(performance.memory.usedJSHeapSize/1048576)}MB/${Math.round(performance.memory.jsHeapSizeLimit/1048576)}MB` : '';
$('info').textContent = navigator.userAgent + mem;
</script>
</body>
</html>
